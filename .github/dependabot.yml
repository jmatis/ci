version: 2
updates:
  # Scanner images in each <scanner>/Dockerfile: Dependabot opens a pull request bumping tag + digest.
  - package-ecosystem: docker
    directories:
      - /semgrep
      - /trivy
      - /osv-scanner
      - /gitleaks
      - /socket
      - /docs
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # socket/Dockerfile's Node base image: stay on Node 22, take only its minor/patch updates
      - dependency-name: library/node # Docker Hub official images are named library/<name>
        update-types: ["version-update:semver-major"]

  # Socket CLI version in socket/package.json
  - package-ecosystem: npm
    directory: /socket
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
